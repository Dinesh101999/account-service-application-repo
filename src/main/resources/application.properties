spring.application.name=accountservice
server.port=8081

# Secrets come from AWS Secrets Manager (keys DB_URL, DB_USER, DB_PASSWORD)
spring.config.import=aws-secretsmanager:accountservice/db
spring.cloud.aws.region.static=ap-southeast-2

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Payment service
clients.payment.url=http://localhost:8082
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always